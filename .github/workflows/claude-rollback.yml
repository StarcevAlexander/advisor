name: Claude rollback

run-name: Claude rollback ${{ inputs.id }}

on:
  workflow_dispatch:
    inputs:
      id:
        description: Rollback id generated by the server (12 hex characters)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: claude-change
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REQUEST_ID: ${{ inputs.id }}
      GH_TOKEN: ${{ github.token }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Validate rollback id
        run: |
          if ! printf '%s' "$REQUEST_ID" | grep -Eq '^[a-f0-9]{12}$'; then
            echo "::error::Invalid rollback id"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick the last change that is not rolled back yet
        id: pick
        run: |
          gh pr list --state merged --base "$BASE_BRANCH" --limit 100 \
            --json number,title,headRefName,mergeCommit,mergedAt,body > "$RUNNER_TEMP/prs.json"
          picked=$(jq -r '
            ([.[]
              | select(.headRefName | startswith("claude/rollback-"))
              | (.body // "")
              | [match("Откат заявки №([0-9]+)"; "g") | .captures[0].string | tonumber]
            ] | add // []) as $done
            | [.[]
                | select(.headRefName | startswith("claude/change-"))
                | select(.number as $n | $done | index($n) | not)]
            | sort_by(.mergedAt)
            | last
            | if . == null then empty else "\(.number) \(.mergeCommit.oid)" end
          ' "$RUNNER_TEMP/prs.json")
          if [ -z "$picked" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to roll back: no merged Claude change is left."
            exit 0
          fi
          number="${picked%% *}"
          commit="${picked##* }"
          title=$(jq -r --argjson n "$number" '.[] | select(.number == $n) | .title' "$RUNNER_TEMP/prs.json" | tr '\n' ' ')
          {
            echo "changed=true"
            echo "number=$number"
            echo "commit=$commit"
            echo "title=$title"
          } >> "$GITHUB_OUTPUT"
          echo "Rolling back pull request #$number ($commit): $title"

      - uses: actions/setup-node@v4
        if: steps.pick.outputs.changed == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Revert the change
        if: steps.pick.outputs.changed == 'true'
        env:
          COMMIT: ${{ steps.pick.outputs.commit }}
        run: |
          git config user.name "advisor-bot"
          git config user.email "advisor-bot@users.noreply.github.com"
          git checkout -b "claude/rollback-${REQUEST_ID}"
          if ! git revert --no-edit "$COMMIT"; then
            git revert --abort || true
            echo "::error::The change cannot be reverted cleanly: later changes depend on it."
            exit 1
          fi
          forbidden=$(git diff --name-only "origin/${BASE_BRANCH}"...HEAD | grep -v -E '^web/(src|public)/' || true)
          if [ -n "$forbidden" ]; then
            echo "::error::The revert touches files outside web/src and web/public:"
            echo "$forbidden"
            exit 1
          fi

      - name: Install app dependencies
        if: steps.pick.outputs.changed == 'true'
        working-directory: web
        run: npm ci

      - name: Run tests and build
        id: check
        if: steps.pick.outputs.changed == 'true'
        working-directory: web
        continue-on-error: true
        run: |
          npm test -- --watch=false
          npm run build

      - name: Open the pull request and publish
        if: steps.pick.outputs.changed == 'true'
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          NUMBER: ${{ steps.pick.outputs.number }}
          CHANGE_TITLE: ${{ steps.pick.outputs.title }}
        run: |
          branch="claude/rollback-${REQUEST_ID}"
          subject="revert(app): ${CHANGE_TITLE#feat(app): }"
          git push origin "$branch"
          {
            echo "Откат заявки №${NUMBER}"
            echo
            printf '> %s\n' "$CHANGE_TITLE"
            echo
            if [ "$CHECK_OUTCOME" = "success" ]; then
              echo "Проверки: тесты и сборка прошли."
            else
              echo "ВНИМАНИЕ: после отката тесты или сборка не прошли, принимать нельзя."
            fi
          } > "$RUNNER_TEMP/pr-body.md"
          draft=""
          if [ "$CHECK_OUTCOME" != "success" ]; then
            draft="--draft"
          fi
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$branch" \
            --title "$subject" \
            --body-file "$RUNNER_TEMP/pr-body.md" \
            $draft
          if [ "$CHECK_OUTCOME" = "success" ]; then
            gh pr merge "$branch" --squash --delete-branch --subject "$subject"
            gh workflow run deploy.yml --ref "$BASE_BRANCH"
          fi
