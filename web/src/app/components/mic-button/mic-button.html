<div class="mic" [class.mic--compact]="compact()">
  <button
    type="button"
    class="mic__button"
    [class.mic__button--listening]="listening()"
    [attr.aria-pressed]="listening()"
    aria-label="Голосовой ввод"
    (click)="pressed.emit()"
  >
    <span class="mic__ring" aria-hidden="true"></span>
    <span class="mic__ring mic__ring--late" aria-hidden="true"></span>
    <svg class="mic__icon" viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4Zm6-4a1 1 0 1 1 2 0 8 8 0 0 1-7 7.94V21h3a1 1 0 1 1 0 2H8a1 1 0 1 1 0-2h3v-2.06A8 8 0 0 1 4 11a1 1 0 1 1 2 0 6 6 0 0 0 12 0Z"
      />
    </svg>
  </button>
  <p class="mic__label" [class.mic__label--problem]="problem()" aria-live="polite">{{ label() }}</p>
</div>
