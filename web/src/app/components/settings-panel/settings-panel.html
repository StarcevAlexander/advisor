<dialog
  #dialog
  class="panel"
  aria-labelledby="settings-title"
  (click)="onDialogClicked($event)"
  (close)="open.set(false)"
>
  <div class="panel__body">
    <header class="panel__header">
      <h2 id="settings-title" class="panel__title">{{ title }}</h2>
      <button
        type="button"
        class="panel__close"
        [attr.aria-label]="closeLabel"
        (click)="open.set(false)"
      >
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
          <path
            d="M6 6l12 12M18 6L6 18"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </header>
    <fieldset class="themes">
      <legend class="themes__title">{{ themeTitle }}</legend>
      <div class="themes__grid">
        @for (option of themes; track option.id) {
          <label class="theme" [attr.data-theme]="option.id">
            <input
              class="theme__input"
              type="radio"
              name="theme"
              [value]="option.id"
              [checked]="settings.theme() === option.id"
              (change)="onThemeChanged(option.id)"
            />
            <span class="theme__preview" aria-hidden="true">
              <span class="theme__header"></span>
              <span class="theme__bubble theme__bubble--assistant"></span>
              <span class="theme__bubble theme__bubble--user"></span>
              <span class="theme__composer">
                <span class="theme__field"></span>
                <span class="theme__mic"></span>
              </span>
            </span>
            <span class="theme__label">{{ option.label }}</span>
          </label>
        }
      </div>
    </fieldset>
    @if (speech.synthesisSupported) {
      <label class="panel__toggle">
        <input
          type="checkbox"
          [checked]="settings.speakReplies()"
          (change)="onSpeakRepliesChanged($event)"
        />
        {{ speakRepliesLabel }}
      </label>
    }
    <label class="panel__toggle">
      <input
        type="checkbox"
        [checked]="settings.developerMode()"
        (change)="onDeveloperModeChanged($event)"
      />
      {{ developerModeLabel }}
    </label>
    <div class="panel__action">
      <button
        type="button"
        class="panel__rollback"
        [disabled]="chat.busy() || !access.granted()"
        (click)="rollbackRequested.emit()"
      >
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
          <path
            d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35Z"
          />
        </svg>
        {{ rollbackLabel }}
      </button>
      <p class="panel__hint">{{ rollbackHint }}</p>
    </div>
  </div>
</dialog>
