<div class="shell">
  <header class="shell__header">
    <h1 class="shell__title">Советчик</h1>
    <div class="shell__tools">
      <button
        type="button"
        class="shell__tool"
        [class.shell__tool--on]="chat.mode() === 'edit'"
        [attr.aria-pressed]="chat.mode() === 'edit'"
        [disabled]="chat.busy() || !access.granted()"
        (click)="chat.toggleEditMode()"
      >
        Править
      </button>
      <button
        type="button"
        class="shell__clear"
        [class.shell__clear--confirm]="confirmingClear()"
        [disabled]="chat.busy() || chat.messages().length < 2"
        (click)="onClearClicked()"
      >
        {{ confirmingClear() ? 'Точно очистить?' : 'Очистить' }}
      </button>
      <span class="shell__version">v{{ version }}</span>
    </div>
  </header>

  <main #log class="shell__log" (scroll)="onLogScrolled()">
    <div class="shell__messages" role="log" aria-live="polite" aria-label="Диалог">
      @for (message of chat.messages(); track message.id) {
        <app-message-bubble
          [message]="message"
          [canSpeak]="speech.synthesisSupported"
          [speaking]="speech.speakingId() === message.id"
          (speakRequested)="speech.speak(message.id, message.text)"
          (stopRequested)="speech.stopSpeaking()"
          (deleteRequested)="onDeleteRequested(message.id)"
        />
      }
    </div>
  </main>

  <footer class="shell__dock">
    @if (access.granted()) {
      @if (speech.interimText(); as interim) {
        <p class="shell__interim">{{ interim }}</p>
      }
      @if (chat.mode() === 'edit') {
        <p class="shell__hint" role="status">{{ editHint }}</p>
      }
      <app-composer
        [busy]="chat.busy()"
        [placeholder]="placeholders[chat.mode()]"
        [(expanded)]="composing"
        (submitted)="onSubmitted($event)"
      />
      <app-mic-button
        [state]="speech.recognitionState()"
        [compact]="composing()"
        (pressed)="onMicPressed()"
      />
    } @else {
      <app-access-gate />
    }
  </footer>
</div>
